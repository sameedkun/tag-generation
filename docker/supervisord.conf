[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---- Queue workers: count comes from env QUEUE_WORKERS (default 1) ----
[program:queue-worker]
command=php /var/www/html/artisan queue:work --queue=%(ENV_QUEUE_NAME)s --sleep=3 --tries=%(ENV_QUEUE_TRIES)s --timeout=%(ENV_QUEUE_TIMEOUT)s --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=%(ENV_QUEUE_WORKERS)s
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=70
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---- Scheduler: runs schedule:run every minute (disable with RUN_SCHEDULER=false) ----
[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
autostart=%(ENV_SCHEDULER_AUTOSTART)s
autorestart=true
stopasgroup=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
